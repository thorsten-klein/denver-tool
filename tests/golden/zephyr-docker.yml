version: 1.0
denver-version: '>=1.7.0'
hooks:
  env: null
  post-docker: null
  post-netrc: null
  pre-cmd: null
  pre-docker:
  - <REPO>/examples/zephyr-docker/create-env.sh
  pre-netrc: null
stages:
- netrc
- docker
netrc:
  provider: netrc
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  endpoints: {}
  expiry-warning: 7
  machines: []
  path: /fake-home/.denver/zephyr-docker/.netrc
  prompt-interactive: true
  recheck-after: 86400
  seed-from: /fake-home/.netrc
  timeout: 5
  verify: true
docker:
  provider: docker
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts:
    setup:
    - setup/install_host_tools.sh
  compose:
    build: true
    default-cmd: fish
    file: docker-compose.yml
    image: null
    run-args:
    - --rm
    service: dev
  exe: docker
  registries: null


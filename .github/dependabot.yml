version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - "/examples/firmware-env/container"
      - "/examples/zephyr-docker/container"
    schedule:
      interval: weekly
    # The base image is pinned to an LTS on purpose: the examples assert the
    # container's exact python3 (uv.python), and the zephyr ones carry a
    # python wheel cache frozen for it. Bump it by hand, together with those.
    ignore:
      - dependency-name: ubuntu

version: 1.0
denver-version: '>=1.7.0'
hooks:
  env:
  - <REPO>/examples/zephyr-devshell/hooks/env.sh
  post-conan: null
  post-docker: null
  post-netrc: null
  post-uv: null
  post-uv-zephyr: null
  post-zephyr: null
  pre-cmd: null
  pre-conan: null
  pre-docker:
  - <REPO>/examples/zephyr-docker/create-env.sh
  pre-netrc: null
  pre-uv: null
  pre-uv-zephyr: null
  pre-zephyr: null
runnable: false
stages:
- netrc
- docker
- conan
- uv
- zephyr
- uv-zephyr
netrc:
  provider: netrc
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  endpoints: {}
  expiry-warning: 7
  machines: []
  path: /fake-home/.denver/zephyr-docker/.netrc
  prompt-interactive: true
  recheck-after: 86400
  seed-from: /fake-home/.netrc
  timeout: 5
  verify: false
docker:
  provider: docker
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts:
    setup:
    - setup/install_host_tools.sh
  authentication: true
  compose:
    build: true
    check-bind-mounts: true
    default-cmd: fish
    file: docker-compose.yml
    image: null
    run-args:
    - --rm
    service: dev
  exe: docker
  registries: null
conan:
  provider: conan
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  authentication: true
  base-classes:
  - <REPO>/examples/zephyr-devshell/conan/base_classes
  build: missing
  channel: snapshot
  conanfile: ''
  config: null
  deployers:
  - <REPO>/src/denver_providers/conan_scripts/extensions/symlink.py
  exe: conan
  install-args: null
  keep-remotes: false
  profiles:
    build: []
    host: []
  recipes: []
  remotes: {}
  user: denver
uv:
  provider: uv
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  amend: true
  exe: uv
  freeze-to: null
  install-args: null
  lockfile: null
  no-index: false
  overrides: null
  patches-apply: null
  python: null
  requirements: null
  venv: null
zephyr:
  provider: zephyr
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts:
    setup:
    - setup/install_jlink_udev_rules.sh
  base: /fake-west-topdir/zephyr-rtos
  blobs-cache: null
  blobs-fetch-allow-failure: false
  blobs-fetch-args:
  - --auto-accept
  exe: west
  patch-committer-date: '2000-01-01T00:00:00'
  patch-committer-email: denver@denver
  patch-committer-name: denver
  patches-yml-path:
  - zephyr/patches.yml
  skip-blobs-fetch: false
  skip-patch-apply: false
  skip-update: false
  topdir: /fake-west-topdir
  update-args: null
  west-config: null
  west-yml: /fake-west-topdir/west.yml
uv-zephyr:
  provider: uv
  description: null
  disabled: false
  depends-on: []
  skip-on-success: []
  skip-on-failure: []
  env: {}
  env-prepend: {}
  env-append: {}
  scripts: null
  amend: true
  exe: uv
  freeze-to: null
  install-args: null
  lockfile: null
  no-index: false
  overrides: null
  patches-apply: null
  python: null
  requirements: null
  venv: null

